<!doctype html>
<html lang="ru" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Параметры тела</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#ffb0c9}a:hover{color:#ffd9e3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #191113; color: #efdfe1; font-family: 'Roboto Flex', system-ui, sans-serif; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 4px; height: 56px; flex-shrink: 0">
    <a href="Profile.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ECE0E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 600">Параметры тела</h1>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <label style="padding: 12px 14px; border-radius: 18px; background: #261d20; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #d5c2c6">Вес, кг</span><input type="number" step="0.1" value="{{w}}" onChange="{{setW}}" style="border: none; background: transparent; color: #efdfe1; font-size: 26px; font-weight: 600; outline: none; padding: 0; width: 100%"></label>
    <label style="padding: 12px 14px; border-radius: 18px; background: #261d20; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #d5c2c6">Рост, см</span><input type="number" value="{{h}}" onChange="{{setH}}" style="border: none; background: transparent; color: #efdfe1; font-size: 26px; font-weight: 600; outline: none; padding: 0; width: 100%"></label>
    <label style="padding: 12px 14px; border-radius: 18px; background: #261d20; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #d5c2c6">Возраст</span><input type="number" value="{{age}}" onChange="{{setAge}}" style="border: none; background: transparent; color: #efdfe1; font-size: 26px; font-weight: 600; outline: none; padding: 0; width: 100%"></label>
    <label style="padding: 12px 14px; border-radius: 18px; background: #261d20; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #d5c2c6">Жир, %</span><input type="number" value="{{bf}}" onChange="{{setBf}}" style="border: none; background: transparent; color: #efdfe1; font-size: 26px; font-weight: 600; outline: none; padding: 0; width: 100%"></label>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 500; color: #d5c2c6; padding-left: 4px">Пол</span>
    <div role="group" aria-label="Пол" style="display: flex; gap: 2px">
      <sc-for list="{{sexes}}" as="x" hint-placeholder-count="2"><button onClick="{{x.pick}}" aria-pressed="{{x.pressed}}" style="{{x.style}}">{{x.label}}</button></sc-for>
    </div>
  </div>
  <section aria-label="Расчёт" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px; border: none; background: #261d20">
    <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 14px; color: #d5c2c6">Сухая масса</span><span style="font-size: 18px; font-weight: 600">{{lean}} кг</span></div>
    <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 14px; color: #d5c2c6">Жировая масса</span><span style="font-size: 18px; font-weight: 600">{{fat}} кг</span></div>
    <div style="display: flex; align-items: baseline"><span style="flex: 1; font-size: 14px; color: #d5c2c6">Обмен в покое</span><span style="font-size: 18px; font-weight: 600">{{bmr}} ккал</span></div>
    <span style="font-size: 12px; line-height: 17px; color: #d5c2c6">Обмен в покое считается от сухой массы — это точнее, чем по весу и росту. Процент жира можно взять из умных весов или замеров калипером.</span>
  </section>
  <a href="Profile.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #ffb0c9; color: #541d33; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Сохранить</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.state = { w: 78.4, h: 180, age: 28, bf: 18, sex: 'm' };
  }
  renderVals() {
    const st = this.state;
    const f1 = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
    const num = key => e => { const v = parseFloat(e.target.value); this.setState({ [key]: isNaN(v) ? 0 : v }); };
    const lean = st.w * (1 - st.bf / 100);
    return {
      w: st.w, h: st.h, age: st.age, bf: st.bf,
      setW: num('w'), setH: num('h'), setAge: num('age'), setBf: num('bf'),
      sexes: [['m', 'Мужской'], ['f', 'Женский']].map(([id, label], i) => {
        const sel = id === st.sex;
        return { label, pressed: sel ? 'true' : 'false', pick: () => this.setState({ sex: id }),
          style: 'flex: 1; height: 48px; border: none; font-size: 15px; font-weight: 500; border-radius: ' + (sel ? '24px' : i === 0 ? '24px 8px 8px 24px' : '8px 24px 24px 8px') + '; background: ' + (sel ? '#e2bdc7' : '#3c3235') + '; color: ' + (sel ? '#422931' : '#efdfe1') };
      }),
      lean: f1(lean), fat: f1(st.w - lean), bmr: Math.round(370 + 21.6 * lean).toLocaleString('ru-RU')
    };
  }
}
</script>
</body>
</html>
