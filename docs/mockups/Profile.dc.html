<!doctype html>
<html lang="ru" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Профиль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#ffb0c9}a:hover{color:#ffd9e3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; overflow: hidden; background: #191113; color: #efdfe1; font-family: 'Roboto Flex', system-ui, sans-serif; padding: 12px 16px 120px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; height: 64px; flex-shrink: 0">
    <h1 style="margin: 0 0 0 8px; flex: 1; font-size: 22px; font-weight: 500">Профиль</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <section aria-label="Аккаунт" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 24px; background: #261d20">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #5a3f48; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffd9e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 21a8 8 0 0 1 16 0"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 500; white-space: nowrap">Google</span>
        <span style="{{accStatusStyle}}">{{accStatus}}</span>
      </span>
      <button onClick="{{toggleGoogle}}" style="{{gBtn}}">{{gLabel}}</button>
    </section>
    <span style="padding: 0 12px; font-size: 12px; line-height: 16px; color: #d5c2c6">{{accSub}}</span>
  </div>

  <section aria-label="Нормы на день" style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0 8px; font-size: 16px; font-weight: 500">Нормы на день</h2>
    <div style="{{normGrid}}">
      <sc-for list="{{norms}}" as="n" hint-placeholder-count="3">
        <button onClick="{{n.open}}" aria-haspopup="dialog" style="{{n.card}}">
          <span style="{{n.iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
          <span style="font-size: 13px; font-weight: 500; color: #efdfe1">{{n.label}}</span>
          <span style="font-size: 20px; font-weight: 600; color: #efdfe1">{{n.k}}</span>
          <span style="display: flex; gap: 6px; white-space: nowrap; font-size: 11px; line-height: 15px; color: #d5c2c6; font-variant-numeric: tabular-nums"><span><b style="color: #d3c4f5; font-weight: 700">Б</b>{{n.p}}</span><span><b style="color: #e6d09a; font-weight: 700">Ж</b>{{n.f}}</span><span><b style="color: #eebd9e; font-weight: 700">У</b>{{n.u}}</span></span>
        </button>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Разделы профиля" style="border-radius: 24px; background: #22191c; overflow: hidden">
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
      <a href="{{m.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; color: #efdfe1; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #3c3235; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{m.label}}</span><span style="font-size: 13px; color: #d5c2c6">{{m.sub}}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </nav>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 30"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="ns-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 10px 20px 24px; border-radius: 28px 28px 0 0; background: #22191c; z-index: 31; display: flex; flex-direction: column; gap: 14px">
      <span aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #d5c2c6; opacity: 0.4"></span>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="{{sh.iconBox}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{sh.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sh.icon}}"></path></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <h2 id="ns-title" style="margin: 0; font-size: 20px; font-weight: 500">{{sh.title}}</h2>
          <span style="font-size: 13px; color: #d5c2c6">{{sh.sub}}</span>
        </div>
      </div>
      <div style="border-radius: 16px; background: #261d20; overflow: hidden">
        <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; padding: 10px 14px; font-size: 12px; color: #d5c2c6">
          <span>Нутриент</span><span style="text-align: right">Обычно</span><span style="text-align: right">{{sh.col}}</span><span style="text-align: right">Разница</span>
        </div>
        <sc-for list="{{sh.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; align-items: center; padding: 12px 14px; font-size: 15px">
            <span style="{{r.nameStyle}}">{{r.name}}</span>
            <span style="text-align: right; color: #d5c2c6">{{r.base}}</span>
            <span style="text-align: right; font-weight: 600">{{r.val}}</span>
            <span style="{{r.diffStyle}}">{{r.diff}}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #d5c2c6">{{sh.why}}</p>
      <div style="display: flex; gap: 8px">
        <a href="Goals.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: none; box-sizing: border-box; color: #efdfe1; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #261d20">Настроить</a>
        <button onClick="{{closeSheet}}" style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #ffb0c9; color: #541d33; font-size: 15px; font-weight: 500">Понятно</button>
      </div>
    </section>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; z-index: 9; background: linear-gradient(to bottom, rgba(25, 17, 19, 0) 0%, rgba(25, 17, 19, 0.55) 45%, rgba(25, 17, 19, 0.85) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); mask-image: linear-gradient(to bottom, transparent 0%, #000 45%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 45%); pointer-events: auto"></div>
  <nav aria-label="Разделы" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 72px; box-sizing: border-box; padding: 8px 6px; display: flex; border-radius: 36px; background: rgba(49, 40, 42, 0.72); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(239, 223, 225, 0.08); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); z-index: 10">
    <a href="Today.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <span style="width: 56px; height: 32px; border-radius: 16px;  display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
      <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.5px; font-weight: 500; color: #d5c2c6">Сегодня</span>
    </a>
    <a href="Weight-history.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <span style="width: 56px; height: 32px; border-radius: 16px;  display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path></svg></span>
      <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.5px; font-weight: 500; color: #d5c2c6">Вес</span>
    </a>
    <a href="Assistant.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <span style="width: 56px; height: 32px; border-radius: 16px;  display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2Z"></path></svg></span>
      <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.5px; font-weight: 500; color: #d5c2c6">Ассистент</span>
    </a>
    <a href="Profile.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #5a3f48; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd9e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 21a8 8 0 0 1 16 0"></path></svg></span>
      <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.5px; font-weight: 700; color: #e2bdc7">Профиль</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sex":{"editor":"enum","options":["m","f"],"default":"m"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.state = { google: false, sheet: null };
  }
  renderVals() {
    const st = this.state;
    const base = { k: 2150, p: 140, f: 70, u: 240 };
    const N = {
      normal: { label: 'Обычный', title: 'Обычный день', sub: 'Рекомпозиция · базовая норма', d: { k: 0, p: 0, f: 0, u: 0 }, ink: '#d5c2c6', bg: '#3c3235', icon: 'M4 6h16M4 12h16M4 18h10',
        why: 'Базовая норма от вашего реального расхода ≈ 2 380 ккал с небольшим дефицитом под рекомпозицию. Белок 1,8 г на кг веса.' },
      train: { label: 'Тренировка', title: 'День тренировки', sub: 'Пн · Ср · Пт', d: { k: 240, p: 0, f: 0, u: 60 }, ink: '#8AB4FF', bg: '#1F2A40', icon: 'M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11',
        why: 'Растут только углеводы: они восполняют гликоген, который тратится на тренировке. Белок и жиры не меняются, поэтому дефицит недели почти не страдает.' },
      cycle: { label: 'Цикл', title: 'Дни цикла', sub: 'Во время менструации', d: { k: 100, p: 0, f: 0, u: 25 }, ink: '#FF8A8A', bg: '#4A2228', icon: 'M12 3.5c3 4 6 7.2 6 10.5a6 6 0 0 1-12 0c0-3.3 3-6.5 6-10.5Z',
        why: 'Немного больше калорий и углеводов, чтобы легче держать режим в эти дни. Величину надбавки можно поменять в настройке целей.' }
    };
    const fmt = (key, v) => key === 'k' ? Math.round(v).toLocaleString('ru-RU') : Math.round(v) + ' г';
    let sh = {};
    if (st.sheet) {
      const n = N[st.sheet];
      sh = {
        title: n.title, sub: n.sub, ink: n.ink, icon: n.icon, why: n.why, col: st.sheet === 'normal' ? 'Сегодня' : 'В этот день',
        iconBox: 'width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + n.bg,
        rows: [['k', 'Ккал', '#efdfe1'], ['p', 'Белки', '#C4A8FF'], ['f', 'Жиры', '#F2C14E'], ['u', 'Углеводы', '#FFA36C']].map(([key, name, c]) => {
          const dv = n.d[key];
          return { name, base: fmt(key, base[key]), val: fmt(key, base[key] + dv),
            diff: dv ? '+' + fmt(key, dv) : '—',
            nameStyle: 'color: ' + c,
            diffStyle: 'text-align: right; font-weight: 600; color: ' + (dv ? n.ink : '#9e8c90') };
        })
      };
    }
    return {
      accStatus: st.google ? 'Подключён' : 'Не подключён',
      accStatusStyle: 'font-size: 13px; white-space: nowrap; color: ' + (st.google ? '#e2bdc7' : '#d5c2c6'),
      accSub: st.google ? 'Последняя синхронизация вчера в 23:10. Дневник, вес и база продуктов сохраняются в облаке.' : 'Подключите аккаунт, чтобы не потерять дневник, вес и базу продуктов при смене телефона.',
      gLabel: st.google ? 'Отключить' : 'Подключить',
      gBtn: 'height: 40px; padding: 0 16px; border-radius: 20px; font-size: 14px; font-weight: 500; flex-shrink: 0; white-space: nowrap; ' + (st.google ? 'border: none; background: #3c3235; color: #efdfe1' : 'border: none; background: #ffb0c9; color: #541d33'),
      toggleGoogle: () => this.setState({ google: !st.google }),
      normGrid: 'display: grid; gap: 8px; grid-template-columns: repeat(' + (this.props.sex === 'f' ? 3 : 2) + ', minmax(0, 1fr))',
      norms: (this.props.sex === 'f' ? ['normal', 'train', 'cycle'] : ['normal', 'train']).map(id => {
        const n = N[id];
        return { label: n.label, icon: n.icon, ink: n.ink, open: () => this.setState({ sheet: id }),
          k: (base.k + n.d.k).toLocaleString('ru-RU'), p: base.p + n.d.p, f: base.f + n.d.f, u: base.u + n.d.u,
          card: 'min-height: 150px; padding: 12px; border-radius: 20px; border: none; background: #261d20; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left',
          iconBox: 'width: 32px; height: 32px; border-radius: 10px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; background: ' + n.bg };
      }),
      menu: [
        ['Параметры тела', '78,4 кг · 180 см · жир 18%', 'Body.dc.html', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 21a8 8 0 0 1 16 0'],
        ['Цель и нормы', 'Рекомпозиция · 2 150 ккал', 'Goals.dc.html', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9ZM12 11.5v1'],
        ['Тренировки', '3 в неделю · силовые, кардио', 'Training.dc.html', 'M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11'],
        ['Вес и замеры', 'тренд 78,7 кг · талия 84 см', 'Weight-history.dc.html', 'M3 17l6-6 4 4 8-8'],
        ['Продукты и блюда', '13 продуктов · 3 блюда', 'Products.dc.html', 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4ZM2 10h20M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'],
        ['Настройки приложения', 'напоминания, данные, вид', 'Settings.dc.html', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z']
      ].map(([label, sub, href, icon]) => ({ label, sub, href, icon })),
      sheetOpen: !!st.sheet, sh,
      closeSheet: () => this.setState({ sheet: null })
    };
  }
}
</script>
</body>
</html>
