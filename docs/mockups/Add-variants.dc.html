<!doctype html>
<html lang="ru" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Выбор варианта продукта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#ffb0c9}a:hover{color:#ffd9e3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #191113; color: #efdfe1; font-family: 'Roboto Flex', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; pointer-events: none">
    <dc-import name="Add-food" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0, 0, 0, 0.5)"></div>
  <section role="dialog" aria-labelledby="av-title" style="position: absolute; left: 16px; top: 196px; width: 280px; box-sizing: border-box; padding: 4px; border-radius: 16px; background: #261d20; box-shadow: 0 10px 28px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #d5c2c6">Вы написали «куриная грудка гриль»</span>
      <h2 id="av-title" style="margin: 0; font-size: 16px; font-weight: 650">Какую именно?</h2>
    </div>
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: #4C2E26; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#efdfe1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 3.5a5.5 5.5 0 0 1 3 9.5l-3.5 3.5-6-6 3.5-3.5a5.5 5.5 0 0 1 3-3.5Z M8 11l-3.5 3.5 M5.5 13.5a2 2 0 1 0 2.5 2.5"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; text-align: left">
          <span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
          <span style="font-size: 12px; color: #d5c2c6">{{o.sub}}</span>
        </span>
        <sc-if value="{{o.sel}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#efbc94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      </button>
    </sc-for>
    <div style="height: 1px; background: #514347; margin: 4px 8px"></div>
    <a href="Product-edit.dc.html" style="height: 48px; padding: 0 12px; border-radius: 14px; color: #efdfe1; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 10px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Создать новый продукт</a>
    <span style="padding: 2px 12px 8px; font-size: 12px; color: #d5c2c6">Выбор запомнится: в следующий раз «грудка гриль» сразу станет этим продуктом.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const opts = [
      ['Куриная грудка гриль', 165, 31, 3.6, 'выбирали 12 раз'],
      ['Куриная грудка варёная', 137, 29.8, 1.8, 'выбирали 3 раза'],
      ['Куриное филе сырое', 113, 23.6, 1.9, 'база'],
      ['Грудка в панировке', 220, 18, 11, 'база']
    ];
    return {
      opts: opts.map((o, i) => {
        const sel = i === this.state.sel;
        return {
          name: o[0], sel, pressed: sel ? 'true' : 'false',
          sub: o[1] + ' ккал · Б ' + String(o[2]).replace('.', ',') + ' · Ж ' + String(o[3]).replace('.', ',') + ' · ' + o[4],
          pick: () => this.setState({ sel: i }),
          style: 'min-height: 56px; padding: 6px 12px 6px 8px; border-radius: 12px; border: none; display: flex; align-items: center; gap: 10px; color: ' + (sel ? '#ffdcc2' : '#efdfe1') + '; background: ' + (sel ? '#623f20' : 'transparent')
        };
      })
    };
  }
}
</script>
</body>
</html>
