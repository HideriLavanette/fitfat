<!doctype html>
<html lang="ru" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#ffb0c9}a:hover{color:#ffd9e3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 980px; box-sizing: border-box; overflow: hidden; background: #191113; color: #efdfe1; font-family: 'Roboto Flex', system-ui, sans-serif; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 4px; height: 64px; flex-shrink: 0">
    <a href="Profile.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#efdfe1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 500">Настройки приложения</h1>
  </div>

  <section aria-label="Оформление" style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0 8px; font-size: 16px; font-weight: 500">Оформление</h2>
    <div style="border-radius: 24px; background: #22191c; padding: 6px 0">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Цвета системы</span><span style="font-size: 13px; color: #d5c2c6">{{dynSub}}</span></span>
        <button onClick="{{flipDyn}}" role="switch" aria-checked="{{dynOn}}" aria-label="Цвета системы" disabled="{{dynDisabled}}" style="{{dynTrack}}"><span style="{{dynThumb}}"></span></button>
      </div>
      <sc-if value="{{manual}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 12px">
          <span style="font-size: 13px; color: #d5c2c6">Тема</span>
          <div role="group" aria-label="Тема" style="display: flex; gap: 2px">
            <sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button></sc-for>
          </div>
          <span style="font-size: 13px; color: #d5c2c6">Цвет приложения</span>
          <div role="group" aria-label="Цвет приложения" style="display: flex; justify-content: space-between">
            <sc-for list="{{seeds}}" as="c" hint-placeholder-count="6"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.label}}" style="{{c.style}}"><sc-if value="{{c.sel}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
          </div>
        </div>
      </sc-if>
    </div>
  </section>

  <div style="border-radius: 24px; background: #22191c; overflow: hidden">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px">
        <sc-if value="{{t.editable}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{t.edit}}" aria-haspopup="dialog" aria-label="{{t.editAria}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0; border: none; background: none; color: #efdfe1; text-align: left">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{t.label}}</span><span style="font-size: 13px; color: #ffb0c9">{{t.sub}}</span></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"></path></svg>
          </button>
          <span aria-hidden="true" style="width: 1px; height: 32px; background: #514347"></span>
        </sc-if>
        <sc-if value="{{t.plain}}" hint-placeholder-val="{{ false }}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{t.label}}</span><span style="font-size: 13px; color: #d5c2c6">{{t.sub}}</span></span>
        </sc-if>
        <button onClick="{{t.flip}}" role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" style="{{t.track}}"><span style="{{t.thumb}}"></span></button>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Дневник по умолчанию</span><span style="font-size: 13px; color: #d5c2c6">как группировать записи</span></span>
      <div role="group" aria-label="Группировка" style="display: flex; gap: 2px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">{{m.label}}</button></sc-for>
      </div>
    </div>
  </div>

  <div style="border-radius: 24px; background: #22191c; overflow: hidden">
    <button style="width: 100%; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 16px; border: none; background: none; color: #efdfe1; font-size: 15px; text-align: left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg><span style="flex: 1">Экспорт в JSON или CSV</span></button>
    <button style="width: 100%; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 16px; border: none; background: none; color: #efdfe1; font-size: 15px; text-align: left"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d5c2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"></path></svg><span style="flex: 1">Импорт данных</span></button>
  </div>
  <sc-if value="{{edOpen}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 30"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="sch-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 10px 20px 24px; border-radius: 28px 28px 0 0; background: #22191c; z-index: 31; display: flex; flex-direction: column; gap: 18px">
      <span aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #d5c2c6; opacity: 0.4"></span>
      <h2 id="sch-title" style="margin: 0; font-size: 22px; font-weight: 500">{{edTitle}}</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 500; color: #d5c2c6">{{edDaysLabel}}</span>
        <div role="group" aria-label="Дни недели" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{edDays}}" as="d" hint-placeholder-count="7"><button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" style="{{d.style}}">{{d.label}}</button></sc-for>
        </div>
        <sc-if value="{{edMulti}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 8px">
            <sc-for list="{{edPresets}}" as="pr" hint-placeholder-count="3"><button onClick="{{pr.pick}}" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #514347; background: none; color: #efdfe1; font-size: 13px; font-weight: 500">{{pr.label}}</button></sc-for>
          </div>
        </sc-if>
      </div>
      <label style="display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px">Время</span>
        <input type="time" value="{{edTime}}" onChange="{{edSetTime}}" style="height: 56px; padding: 0 16px; border-radius: 4px; border: 1px solid #9e8c90; background: #191113; color: #efdfe1; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums">
      </label>
      <span style="font-size: 13px; color: #d5c2c6">{{edPreview}}</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{edCancel}}" style="flex: 1; height: 56px; border-radius: 28px; border: none; background: none; color: #ffb0c9; font-size: 16px; font-weight: 500">Отмена</button>
        <button onClick="{{edSave}}" style="flex: 1.4; height: 56px; border-radius: 28px; border: none; background: #ffb0c9; color: #541d33; font-size: 16px; font-weight: 500">Сохранить</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["android","ios"],"default":"android"},"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.state = { remind: true, report: true, haptic: true, mode: 'meal', dyn: true, theme: 'dark', seed: 'pink', rDays: [0, 1, 2, 3, 4, 5, 6], rTime: '07:30', wDay: 4, wTime: '20:00', ed: null };
  }
  renderVals() {
    const st = this.state;
    const DN = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const DFULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
    const DPL = ['по понедельникам', 'по вторникам', 'по средам', 'по четвергам', 'по пятницам', 'по субботам', 'по воскресеньям'];
    const remindText = (days, time) => {
      const d = days.slice().sort();
      if (!d.length) return 'дни не выбраны';
      const when = d.length === 7 ? 'каждый день' : d.join() === '0,1,2,3,4' ? 'по будням' : d.join() === '5,6' ? 'по выходным' : d.map(i => DN[i]).join(', ');
      return when + ' в ' + time;
    };
    const reportText = (day, time) => DPL[day] + ' в ' + time;
    const sw = (key, label, sub) => {
      const on = st[key];
      return {
        label, sub, on: on ? 'true' : 'false', flip: () => this.setState({ [key]: !on }),
        track: 'flex-shrink: 0; width: 52px; height: 32px; padding: 0; border-radius: 16px; position: relative; border: 2px solid ' + (on ? '#ffb0c9' : '#9e8c90') + '; background: ' + (on ? '#ffb0c9' : '#3c3235') + '; box-sizing: border-box',
        thumb: 'position: absolute; top: 50%; transform: translateY(-50%); border-radius: 50%; left: ' + (on ? '22px' : '4px') + '; width: ' + (on ? '24px' : '16px') + '; height: ' + (on ? '24px' : '16px') + '; background: ' + (on ? '#541d33' : '#9e8c90')
      };
    };
    const ios = this.props.platform === 'ios';
    const dyn = st.dyn && !ios;
    const seeds = [['pink', 'Розовый', '#ffb0c9', '#541d33'], ['lilac', 'Сиреневый', '#d0bcff', '#381e72'], ['blue', 'Синий', '#a8c7fa', '#062e6f'], ['teal', 'Бирюзовый', '#80d5d0', '#003735'], ['green', 'Зелёный', '#a6d394', '#103800'], ['orange', 'Оранжевый', '#ffb68b', '#522300']];
    return {
      dynOn: dyn ? 'true' : 'false', dynDisabled: ios,
      dynSub: ios ? 'Недоступно на iPhone — выберите тему и цвет ниже' : dyn ? 'Тема и цвет берутся из обоев и настроек телефона' : 'Выключено — тема и цвет задаются вручную',
      flipDyn: () => this.setState({ dyn: !st.dyn }),
      dynTrack: 'flex-shrink: 0; width: 52px; height: 32px; padding: 0; border-radius: 16px; position: relative; box-sizing: border-box; opacity: ' + (ios ? 0.38 : 1) + '; border: 2px solid ' + (dyn ? '#ffb0c9' : '#9e8c90') + '; background: ' + (dyn ? '#ffb0c9' : '#3c3235'),
      dynThumb: 'position: absolute; top: 50%; transform: translateY(-50%); border-radius: 50%; left: ' + (dyn ? '22px' : '4px') + '; width: ' + (dyn ? '24px' : '16px') + '; height: ' + (dyn ? '24px' : '16px') + '; background: ' + (dyn ? '#541d33' : '#9e8c90'),
      manual: !dyn,
      themes: [['system', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([id, label], i) => {
        const sel = id === st.theme;
        return { label, pressed: sel ? 'true' : 'false', pick: () => this.setState({ theme: id }),
          style: 'flex: 1; height: 40px; border: none; font-size: 13px; font-weight: 500; border-radius: ' + (sel ? '20px' : i === 0 ? '20px 8px 8px 20px' : i === 2 ? '8px 20px 20px 8px' : '8px') + '; background: ' + (sel ? '#e2bdc7' : '#3c3235') + '; color: ' + (sel ? '#422931' : '#efdfe1') };
      }),
      seeds: seeds.map(([id, label, c, ink]) => {
        const sel = id === st.seed;
        return { label, sel, ink, pressed: sel ? 'true' : 'false', pick: () => this.setState({ seed: id }),
          style: 'width: 44px; height: 44px; border-radius: ' + (sel ? '14px' : '22px') + '; border: none; display: flex; align-items: center; justify-content: center; background: ' + c + '; transition: border-radius 0.2s' };
      }),
      ...(() => {
        const ed = st.ed;
        if (!ed) return { edOpen: false, edDays: [], edPresets: [] };
        const multi = ed.kind === 'remind';
        const setEd = o => this.setState({ ed: Object.assign({}, this.state.ed, o) });
        return {
          edOpen: true, edMulti: multi,
          edTitle: multi ? 'Напоминание о весе' : 'Недельный отчёт',
          edDaysLabel: multi ? 'В какие дни напоминать' : 'В какой день присылать',
          edDays: DN.map((label, i) => {
            const sel = ed.days.indexOf(i) >= 0;
            return { label, aria: DFULL[i], pressed: sel ? 'true' : 'false',
              pick: () => setEd({ days: multi ? (sel ? ed.days.filter(x => x !== i) : ed.days.concat([i])) : [i] }),
              style: 'height: 44px; border-radius: ' + (sel ? '22px' : '12px') + '; border: none; font-size: 13px; font-weight: 500; background: ' + (sel ? '#ffb0c9' : '#31282a') + '; color: ' + (sel ? '#541d33' : '#d5c2c6') };
          }),
          edPresets: [['Каждый день', [0, 1, 2, 3, 4, 5, 6]], ['По будням', [0, 1, 2, 3, 4]], ['По выходным', [5, 6]]].map(([label, d]) => ({ label, pick: () => setEd({ days: d.slice() }) })),
          edTime: ed.time,
          edSetTime: e => setEd({ time: e.target.value || ed.time }),
          edPreview: multi ? 'Будет: ' + remindText(ed.days, ed.time) : 'Будет: ' + reportText(ed.days[0], ed.time),
          edCancel: () => this.setState({ ed: null }),
          edSave: () => this.setState(multi ? { rDays: ed.days.slice(), rTime: ed.time, ed: null, remind: ed.days.length ? st.remind : false } : { wDay: ed.days[0], wTime: ed.time, ed: null })
        };
      })(),
      toggles: [
        Object.assign(sw('remind', 'Напоминание о весе', remindText(st.rDays, st.rTime)), { editable: true, plain: false, editAria: 'Изменить дни и время напоминания о весе', edit: () => this.setState({ ed: { kind: 'remind', days: st.rDays.slice(), time: st.rTime } }) }),
        Object.assign(sw('report', 'Недельный отчёт', reportText(st.wDay, st.wTime)), { editable: true, plain: false, editAria: 'Изменить день и время недельного отчёта', edit: () => this.setState({ ed: { kind: 'report', days: [st.wDay], time: st.wTime } }) }),
        Object.assign(sw('haptic', 'Звук и вибрация колеса', 'щелчки при вводе веса'), { editable: false, plain: true })
      ],
      modes: [['meal', 'Приёмы'], ['time', 'Время']].map(([id, label], i) => {
        const sel = id === st.mode;
        return { label, pressed: sel ? 'true' : 'false', pick: () => this.setState({ mode: id }),
          style: 'height: 36px; padding: 0 12px; border: none; font-size: 13px; font-weight: 600; border-radius: ' + (sel ? '18px' : i === 0 ? '18px 8px 8px 18px' : '8px 18px 18px 8px') + '; background: ' + (sel ? '#e2bdc7' : '#3c3235') + '; color: ' + (sel ? '#422931' : '#efdfe1') };
      })
    };
  }
}
</script>
</body>
</html>
