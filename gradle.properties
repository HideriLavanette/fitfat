org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Репозиторий GitHub, из релизов которого приложение берёт обновления.
# Замените на свой: <пользователь>/<репозиторий>
updateRepo=HideriLavanette/FitFat
# Вход через Google: Client ID типа «Веб-приложение» из Google Cloud Console (docs/DESIGN.md, «Аккаунт Google»)
googleWebClientId=708835430684-gcd4jakjonpkrepbjkqihc8bagpo5bqr.apps.googleusercontent.com
# Ассистент: адрес Worker'а после «npx wrangler deploy» (server/assistant/README.md). Пусто — ассистента нет.
assistantUrl=https://fitfat-assistant.fitfat.workers.dev

# Kotlin Multiplatform: цели iOS на Windows/Linux не собираются — не падать, а пропускать
kotlin.native.ignoreDisabledTargets=true
